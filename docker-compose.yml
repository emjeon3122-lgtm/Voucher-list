# 상품권 수불 관리 — Synology Container Manager 에서 이 파일로 실행한다(프로젝트 › 생성 › 이 폴더 선택).
#
#   직원 브라우저 ──https──▶ DSM 역방향 프록시(예: 7031) ──http──▶ 127.0.0.1:7030 (이 컨테이너) ──▶ ./data
#
# - 이 NAS 는 컨테이너 간 bridge 통신이 안 되므로 host 네트워크로 띄운다(실적 대시보드와 같은 방식).
#   앱은 127.0.0.1:${PORT} 만 열어 NAS 밖에서는 직접 닿지 않는다.
# - 데이터(DB·서명 이미지·백업)는 ./data 한 곳에만 저장되어 컨테이너를 지우고 다시 만들어도 남는다.
# - 설정값은 같은 폴더의 .env 에서 읽는다(.env.example 참고). .env 는 공유하지 않는다.
services:
  voucher:
    build: .
    image: voucher-ledger:latest
    container_name: voucher-ledger
    restart: unless-stopped
    network_mode: host
    # ./data 폴더의 소유자와 같은 NAS 계정으로 실행 (SSH 에서 `id 계정명` 으로 확인)
    user: "${APP_UID:?.env에 APP_UID를 지정하세요}:${APP_GID:?.env에 APP_GID를 지정하세요}"
    env_file: .env
    environment:
      DATA_DIR: /data         # 컨테이너 안 경로는 고정. NAS 쪽 위치는 아래 volumes 로 정한다
    volumes:
      - ./data:/data          # DB(voucher.db)·서명 이미지(signatures/)·자동 백업(backups/)
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:                 # 리눅스 특수 권한은 하나도 필요 없다(7030은 일반 포트)
      - ALL
    mem_limit: 512m           # 메모리·프로세스 수 상한(이상 동작 시 NAS 전체에 영향이 가지 않게)
    pids_limit: 200
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
